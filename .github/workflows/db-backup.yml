# Daily DB backup — ALL gyms, one file, emailed to you.
#
# SETUP (one time, ~5 min):
#   1. Repo page -> Settings -> Secrets and variables -> Actions -> New repository secret.
#      Add these 3 secrets (values only you see; they stay encrypted in GitHub):
#        DB_PASSWORD        - Supabase database password (Settings -> Database in Supabase)
#        EMAIL_USER         - your Gmail address (e.g. sales.shfashion@gmail.com)
#        EMAIL_APP_PASSWORD - Google "App password": myaccount.google.com -> Security ->
#                             2-Step Verification ON -> App passwords -> create one for "Mail"
#   2. Done. Every night at 00:00 IST a full backup (every gym_id) is dumped and emailed.
#      Manual run any time: Actions tab -> "Daily DB backup" -> Run workflow.
#
# No third-party actions used — official PostgreSQL 17 image + Python stdlib.
# The DB password never appears in logs or the repo.

name: Daily DB backup

on:
  schedule:
    - cron: '30 18 * * *' # 00:00 IST
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database (all gyms)
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -o pipefail
          # Direct DB host is IPv6-only (unreachable from GitHub runners),
          # so use Supabase's connection pooler (IPv4) in session mode (port 5432).
          # Pooler needs the username as postgres.<project-ref>.
          # Supabase runs PostgreSQL 17, so run pg_dump from the matching
          # PostgreSQL 17 image (the runner's bundled client is older).
          docker run --rm \
            -e PGPASSWORD \
            postgres:17-alpine \
            pg_dump --schema=public \
            -h aws-0-ap-south-1.pooler.supabase.com -p 5432 \
            -U postgres.usalkhzjtnkvqdusrauf postgres \
            | gzip > "gym-backup-$(date +%F).sql.gz"
          SZ=$(stat -c%s gym-backup-*.sql.gz)
          echo "backup size: $SZ bytes"
          [ "$SZ" -gt 1000 ] || { echo "backup too small, failing"; exit 1; }

      - name: Email backup
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import smtplib, os, glob, sys
          from email.message import EmailMessage
          # Clean the secrets in-code too: email may have stray spaces and a
          # Google App Password is valid only as one continuous 16-letter value.
          user = ''.join(os.environ['EMAIL_USER'].split())
          app_password = ''.join(os.environ['EMAIL_APP_PASSWORD'].split())
          domain = user.rsplit('@', 1)[-1] if '@' in user else 'INVALID'
          print(f'SMTP check: email domain={domain}, app password length={len(app_password)}')
          if '@' not in user:
              sys.exit('EMAIL_USER is not a full email address')
          if len(app_password) != 16:
              sys.exit('EMAIL_APP_PASSWORD must be exactly 16 letters after removing spaces')
          f = sorted(glob.glob('gym-backup-*.sql.gz'))[-1]
          msg = EmailMessage()
          msg['Subject'] = 'Gym DB backup ' + f.replace('gym-backup-', '').replace('.sql.gz', '')
          msg['From'] = user
          msg['To'] = user
          msg.set_content('All-gyms database backup attached. (automated daily backup)')
          with open(f, 'rb') as fh:
              msg.add_attachment(fh.read(), maintype='application', subtype='gzip', filename=f)
          try:
              # Use Gmail's STARTTLS port 587 with explicit EHLO before/after TLS.
              with smtplib.SMTP('smtp.gmail.com', 587, timeout=30) as s:
                  s.ehlo()
                  s.starttls()
                  s.ehlo()
                  s.login(user, app_password)
                  s.send_message(msg)
          except smtplib.SMTPAuthenticationError as e:
              detail = e.smtp_error.decode(errors='replace') if isinstance(e.smtp_error, bytes) else str(e.smtp_error)
              print(f'Gmail authentication rejected ({e.smtp_code}): {detail}')
              raise
          print('emailed', f)
          PYEOF
