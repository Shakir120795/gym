<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Gym Manager — Admin</title>
<meta name="theme-color" content="#0B0D0F">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0B0D0F;--card:#14171B;--card2:#1B1F26;--line:#262B33;--txt:#F2F3F5;--mute:#9AA3B2;--gold:#E3B341;--gold2:#F5CE6B;--grad:linear-gradient(120deg,#F5CE6B,#C9962E);--green:#43C579;--red:#E4574F;--r:16px}
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 Barlow,system-ui,sans-serif}
  [hidden]{display:none!important}
  h1,h2{font-family:"Barlow Condensed",sans-serif;letter-spacing:.02em;margin:0}
  .wrap{max-width:860px;margin:0 auto;padding:18px 14px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
  label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
  input,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 12px;font:inherit}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:10px 16px;font:600 15px Barlow;cursor:pointer;text-decoration:none}
  .btn.primary{background:var(--grad);color:#1A1405;border:0}
  .btn.danger{background:transparent;border-color:var(--red);color:#F08A84}
  .btn.small{padding:7px 12px;font-size:13px}
  .btn.wide{width:100%;margin-top:14px}
  .rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .pill.active{background:rgba(67,197,121,.16);color:#6FD598}
  .pill.trial{background:rgba(232,184,75,.16);color:var(--gold2)}
  .pill.locked{background:rgba(228,87,79,.16);color:#F08A84}
  .pill.none{background:rgba(154,163,178,.16);color:var(--mute)}
  .gym-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .gym-head b{font-size:19px}
  .small{color:var(--mute);font-size:13px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
  .stat b{font:700 26px "Barlow Condensed";display:block}
  .stat small{color:var(--mute);font-size:12px}
  .userrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px;flex-wrap:wrap}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .topbar h1{font-size:30px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  #loginView{max-width:420px;margin:8vh auto 0}
  #msg,#demoMsg{color:#F08A84;font-weight:600;min-height:1.3em;margin-top:10px}
  #demoResult{background:var(--card2);border:1px dashed var(--gold);border-radius:10px;padding:12px;margin-top:12px;white-space:pre-wrap;word-break:break-word;font-size:14px}
  .empty{color:var(--mute);text-align:center;padding:26px 10px}
  .alertbox{border-radius:var(--r);padding:13px 16px;margin-bottom:12px;font-size:15px}
  .alertbox.bad{background:rgba(228,87,79,.14);border:1px solid var(--red)}
  .alertbox.warn{background:rgba(232,184,75,.12);border:1px solid var(--gold)}
  @media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">

  <div id="loginView" hidden>
    <div class="card">
      <h1 style="font-size:30px">Gym Manager — Admin</h1>
      <p class="small">Sirf super admin ke liye. Apne admin email/password se login karo.</p>
      <form id="loginForm" autocomplete="on">
        <label>Email<input name="email" type="email" required autocomplete="username"></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
        <button class="btn primary wide">Login</button>
        <p id="msg" role="alert"></p>
      </form>
    </div>
  </div>

  <div id="panelView" hidden>
    <div class="topbar">
      <h1>Admin Panel</h1>
      <div style="display:flex;gap:8px">
        <button class="btn small" data-aact="refresh">Refresh</button>
        <button class="btn small" data-aact="logout">Logout</button>
      </div>
    </div>
    <p class="small" id="whoLine" style="margin-top:-8px"></p>

    <div class="rowbtns" style="margin-bottom:16px">
      <button class="btn primary" data-atab="gyms" id="tabBtnGyms">Saare Gyms</button>
      <button class="btn" data-atab="new" id="tabBtnNew">+ Naya Gym Banao</button>
    </div>

    <div id="tabGyms">
      <div id="alertStrip"></div>
      <div class="stats" id="statStrip"></div>
      <h2 style="font-size:22px;margin:16px 0 10px">Saare gyms</h2>
      <div id="gymList"><div class="empty">Loading...</div></div>
    </div>

    <div id="tabNew" hidden>
    <div class="card">
      <h2 style="font-size:22px">Naya gym — trial ya seedha paid</h2>
      <form id="demoForm" autocomplete="off">
        <label>Gym ka naam<input name="gymName" required placeholder="e.g. Power House Gym"></label>
        <label>Owner ka email<input name="email" type="email" required placeholder="owner@example.com"></label>
        <label>Owner ka password
          <span style="display:flex;gap:8px"><input name="password" id="demoPw" required minlength="6" placeholder="Login password">
          <button type="button" class="btn small" data-aact="genPw">Generate</button></span>
        </label>
        <label>Plan chunno
          <select name="plan">
            <option value="trial">Trial — 7 din FREE</option>
            <option value="monthly">Monthly — 30 din (paid)</option>
            <option value="quarterly">3 Months (paid)</option>
            <option value="half">6 Months (paid)</option>
            <option value="yearly">Yearly (paid)</option>
            <option value="lifetime">Lifetime (paid)</option>
          </select>
        </label>
        <button class="btn primary wide">Gym banao</button>
        <p id="demoMsg" role="alert"></p>
      </form>
      <div id="demoResult" hidden></div>
    </div>
    </div>
  </div>

</div>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
